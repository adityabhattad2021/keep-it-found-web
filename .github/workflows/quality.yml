name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js from the project contract
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked website dependencies
        run: npm ci

      - name: Check and build the website
        run: npm run check

  voting-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js from the backend contract
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install locked backend dependencies
        run: npm ci --prefix functions

      - name: Check the voting backend
        run: npm run check --prefix functions
